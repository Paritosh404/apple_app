name: PhotoUSBBackup

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  PhotoUSBBackup:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - PhotoUSBBackup
    info:
      path: PhotoUSBBackup/Info.plist
      properties:
        CFBundleDisplayName: Originals Backup
        CFBundleShortVersionString: "2.3"
        CFBundleVersion: "5"
        LSRequiresIPhoneOS: true
        NSPhotoLibraryUsageDescription: "Originals Backup needs access to copy your unmodified photo and video originals to an external drive."
        BGTaskSchedulerPermittedIdentifiers:
          - com.paritosh.PhotoUSBBackup.userExport
        UIBackgroundModes:
          - processing
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paritosh.PhotoUSBBackup
        PRODUCT_NAME: PhotoUSBBackup
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

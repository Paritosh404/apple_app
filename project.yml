name: PhotoUSBBackup

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  PhotoUSBBackup:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - PhotoUSBBackup
    info:
      path: PhotoUSBBackup/Info.plist
      properties:
        CFBundleDisplayName: Album Copy
        CFBundleShortVersionString: "3.5"
        CFBundleVersion: "35"
        LSRequiresIPhoneOS: true
        NSPhotoLibraryUsageDescription: "Album Copy needs access to read your Photos albums and copy them."
        NSLocalNetworkUsageDescription: "Album Copy uses your local Wi-Fi network to send album folders and files to your PC."
        BGTaskSchedulerPermittedIdentifiers:
          - com.paritosh.PhotoUSBBackup.albumCopy
        UIBackgroundModes:
          - processing
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paritosh.PhotoUSBBackup
        PRODUCT_NAME: PhotoUSBBackup
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

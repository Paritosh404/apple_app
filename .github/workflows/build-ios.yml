name: Build iPhone IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify Photos privacy key
        run: /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" PhotoUSBBackup/Info.plist

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoUSBBackup.xcodeproj \
            -scheme PhotoUSBBackup \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/PhotoUSBBackup.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry PhotoUSBBackup-v3.0-Album-Copy-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhotoUSBBackup-v3.0-Album-Copy-unsigned-ipa
          path: PhotoUSBBackup-v3.0-Album-Copy-unsigned.ipa
          if-no-files-found: error

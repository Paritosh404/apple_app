name: Build iPhone IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare PhotoUSB app icon
        run: |
          python3 -c "import base64,pathlib; p=pathlib.Path('PhotoUSBBackup/Assets.xcassets/AppIcon.appiconset/AppIcon-source.jpg.b64'); p.with_name('AppIcon-source.jpg').write_bytes(base64.b64decode(p.read_text()))"
          sips -s format png -z 1024 1024 PhotoUSBBackup/Assets.xcassets/AppIcon.appiconset/AppIcon-source.jpg --out PhotoUSBBackup/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project PhotoUSBBackup.xcodeproj \
            -scheme PhotoUSBBackup \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/PhotoUSBBackup.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry PhotoUSBBackup-v3.7.2-Background-Transfer-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoUSBBackup-v3.7.2-Background-Transfer-unsigned-ipa
          path: PhotoUSBBackup-v3.7.2-Background-Transfer-unsigned.ipa

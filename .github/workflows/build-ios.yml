name: Build iPhone IPA
on: { workflow_dispatch: {} }
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project PhotoUSBBackup.xcodeproj -scheme PhotoUSBBackup -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PhotoUSBBackup.app Payload/
          /usr/bin/zip -qry PhotoUSBBackup-v2-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoUSBBackup-v2-unsigned-ipa
          path: PhotoUSBBackup-v2-unsigned.ipa
